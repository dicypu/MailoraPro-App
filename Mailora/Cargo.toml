[package]
name = "mailora"
version = "2.0.0"
edition = "2021"
description = "Mailora — Multi-account email client with IMAP/SMTP"

[dependencies]
actix-web = "4"
actix-files = "0.6"
actix-multipart = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
dotenv = "0.15"
uuid = { version = "1", features = ["v4"] }
bcrypt = "0.16"
jsonwebtoken = "9"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
